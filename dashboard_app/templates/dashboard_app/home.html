{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Text to Dashboard</title>
    <link rel="stylesheet" href="{% static 'style.css' %}">
    <style>
        /* Style for the logo */
        .logo {
            position: absolute;
            top: -25px;
            left: -20px;
            width: 200px;  /* Adjust size as needed */
            height: auto;
        }
        .login-btn{
            background-color: rgb(13, 45, 110);
        }
        .login-btn:hover{
            background-color: rgb(17, 59, 143);
            color:  rgb(0, 187, 255);
        }

        .adjusted-image {
            display: block;
            margin: -50px 0px 0px -200px; /* Moves image slightly to the left */
            max-width: 100%;
            height: 50%;
        }
    </style>
</head>
<body style="background-image: url('{% static "images/background.jpg" %}'); background-size: auto; text-align: center;">

    <!-- Logo positioned in the top-left corner -->
    <img src="{% static 'images/logo.png' %}" alt="Logo" class="logo">

    <div class="container">
        <h1>AutoViz</h1>

        <!-- Adjusted image alignment -->
        <img src="{% static 'images/temp.png' %}" alt="Homepage Image" class="adjusted-image">

        <a href="/login" class="login-btn">Get Started</a>
    </div>
</body>
</html>
